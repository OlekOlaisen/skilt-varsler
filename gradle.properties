org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JAVA_HOME
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
# Debug APKs are testOnly by default; Android Auto/DHU often fails to host those.
android.injected.testOnly=false


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Public GitHub Release populated by .github/workflows/pipeline.yml
tileBaseUrl=https://github.com/OlekOlaisen/skilt-varsler/releases/latest/download
