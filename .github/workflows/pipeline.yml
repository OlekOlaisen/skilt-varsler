name: NVDB tile pipeline

on:
  workflow_dispatch:
    inputs:
      kommuner:
        description: Kommunenummer, komma-separert, all, eller changed
        required: true
        default: "all"
  schedule:
    - cron: "20 2 * * 0"
    - cron: "20 3 1 * *"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - id: plan
        working-directory: pipeline
        env:
          NVDB_X_CLIENT: skilt-varsler-pipeline
          NVDB_X_KONTAKTPERSON: ${{ secrets.NVDB_X_KONTAKTPERSON }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "20 3 1 * *" ]; then
              KOMMUNER=all
            else
              KOMMUNER=changed
            fi
          else
            KOMMUNER="${{ github.event.inputs.kommuner || 'all' }}"
          fi
          echo "Bygger kommuner: $KOMMUNER"
          CHUNKS=$(python -m skiltvarsler_pipeline --plan-chunks 15 --kommune "$KOMMUNER" --changelog-days 10)
          if [ "$CHUNKS" = "[]" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "chunks<<EOF"
            echo "$CHUNKS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Build tile
        env:
          NVDB_X_CLIENT: skilt-varsler-pipeline
          NVDB_X_KONTAKTPERSON: ${{ secrets.NVDB_X_KONTAKTPERSON }}
        run: |
          python -m skiltvarsler_pipeline \
            --kommune "${{ matrix.kommuner }}" \
            --out tiles-out
        working-directory: pipeline
      - uses: actions/upload-artifact@v4
        if: hashFiles('pipeline/tiles-out/manifest.json') != ''
        with:
          name: nvdb-tiles-${{ matrix.id }}
          path: pipeline/tiles-out
          if-no-files-found: ignore

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: nvdb-tiles-*
          path: incoming
          merge-multiple: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: pipeline
        run: |
          if ! find incoming -name 'manifest.json' | grep -q .; then
            echo "Ingen nye fliser å publisere"
            exit 0
          fi
          mkdir -p existing
          TAG=nvdb-tiles
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern manifest.json --dir existing || true
          fi
          python -m skiltvarsler_pipeline --merge-release existing incoming merged
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" merged/* --clobber
            gh release edit "$TAG" --notes "Oppdatert ${GITHUB_SHA:0:7} (${GITHUB_RUN_ID})"
          else
            gh release create "$TAG" merged/* \
              --title "NVDB-fliser" \
              --notes "Første uttrekk ${GITHUB_SHA:0:7}" \
              --latest
          fi
