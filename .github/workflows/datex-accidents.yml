name: DATEX accidents

on:
  workflow_dispatch:
  schedule:
    # Every 20 minutes — Accident filter only (small payload).
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

jobs:
  situations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Download current situations.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pipeline/situations-out
          gh release download nvdb-tiles -p situations.json \
            -D pipeline/situations-out --clobber || true
          if [ -f pipeline/situations-out/situations.json ]; then
            cp pipeline/situations-out/situations.json pipeline/situations-out/previous.json
          fi
      - name: Build accidents slice
        id: build
        working-directory: pipeline
        env:
          DATEX_USER: ${{ secrets.DATEX_USER }}
          DATEX_PASSWORD: ${{ secrets.DATEX_PASSWORD }}
        run: |
          MERGE_ARGS=()
          SKIP_ARGS=()
          if [ -f situations-out/previous.json ]; then
            MERGE_ARGS=(--merge-with situations-out/previous.json)
            SKIP_ARGS=(--skip-if-unchanged)
          fi
          rm -f situations-out/built.json
          if [ -n "$DATEX_USER" ] && [ -n "$DATEX_PASSWORD" ]; then
            python -m skiltvarsler_pipeline --build-situations \
              --datex-profile accidents \
              "${MERGE_ARGS[@]}" \
              "${SKIP_ARGS[@]}" \
              --situations-out situations-out/built.json
          else
            echo "DATEX secrets mangler — bygger fixture"
            python -m skiltvarsler_pipeline --build-situations \
              --fixture tests/fixtures/datex_situation_sample.xml \
              --datex-profile accidents \
              "${MERGE_ARGS[@]}" \
              --situations-out situations-out/built.json
          fi
          if [ ! -f situations-out/built.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen endringer — hopper over upload"
            exit 0
          fi
          mv situations-out/built.json situations-out/situations.json
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("situations-out/situations.json").read_text(encoding="utf-8"))
          types = {}
          for item in payload.get("situations") or []:
              key = item.get("type")
              types[key] = types.get(key, 0) + 1
          print(f"situations={sum(types.values())} types={types} source={payload.get('source')}")
          PY
      - name: Upload to nvdb-tiles release
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload nvdb-tiles pipeline/situations-out/situations.json --clobber || \
          gh release create nvdb-tiles pipeline/situations-out/situations.json \
            --title "NVDB-fliser" \
            --notes "Situations feed for live roadworks and accidents (DATEX)."
